<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>The Box Model & Box-Sizing</h1>

        <div class="comparison-section">
            <div class="box content-box-example">
                <h3>content-box</h3>
                <p>Padding and border are ADDED to the width.</p>
            
            <div class="box border-box-example">
                <h3>border-box</h3>
                <p>Padding and border are contained WITHIN the width.</p>
            </div>
        </div>
    </div>

</body>
</html>
