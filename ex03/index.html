<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Colors & Opacity Palette</h1>

        <section class="palette-section">
            <div class="swatch named">Named: Crimson</div>
            <div class="swatch hex">HEX: #800020</div>
            <div class="swatch rgb">RGB: rgb(128, 0, 32)</div>
            <div class="swatch rgba">RGBA: rgba(128, 0, 32, 0.6)</div>
        </section>

        <h2>Opacity vs RGBA Comparison</h2>
        
        <div class="comparison-section">
            <div class="box opacity-box">
                <p>This box uses <strong>opacity: 0.5</strong> (fades text too)</p>
            </div>

            <div class="box rgba-box">
                <p>This box uses <strong>rgba background</strong> (text stays clear)</p>
            </div>
        </div>
    </div>

</body>
</html>
